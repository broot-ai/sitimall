<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Отчёт</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --radius: 12px;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    .report {
      max-width: 760px;
      margin: 0 auto;
    }

    .section {
      margin: 0 0 16px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .section legend {
      padding: 0 8px;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr minmax(140px, 220px);
      gap: 12px;
      align-items: center;
      margin-bottom: 10px;
    }

    .row:last-child {
      margin-bottom: 0;
    }

    label {
      color: var(--muted);
      font-size: 0.95rem;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      font: inherit;
      color: var(--text);
      background: #fff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    input[readonly] {
      background: #f3f4f6;
      color: #374151;
      cursor: default;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 12px;
    }

    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 9px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:active {
      transform: translateY(1px);
    }

    button.secondary {
      background: #e5e7eb;
      color: #111827;
    }

    button.secondary:hover {
      background: #d1d5db;
    }

    textarea {
      width: 100%;
      min-height: 240px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      resize: vertical;
      font: 0.95rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--text);
      background: #fff;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .status {
      min-height: 1.3em;
      margin-top: 8px;
      color: #047857;
      font-size: 0.9rem;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 520px) {
      body {
        padding: 12px;
      }

      .section {
        padding: 14px;
      }

      .row {
        grid-template-columns: 1fr;
        gap: 6px;
      }
    }
  </style>
</head>
<body>

<form id="reportForm" class="report" novalidate>
  <fieldset class="section">
    <legend>Основной отчёт</legend>

    <div class="row">
      <label for="time">На время:</label>
      <input id="time" name="time" type="time" value="16:00" step="60">
    </div>

    <div class="row">
      <label for="cash">Нал:</label>
      <input id="cash" name="cash" type="number" value="0" min="0" step="0.01" inputmode="decimal">
    </div>

    <div class="row">
      <label for="cashless">Б/н:</label>
      <input id="cashless" name="cashless" type="number" value="0" min="0" step="0.01" inputmode="decimal">
    </div>

    <div class="row">
      <label for="promo">Прокатов акции:</label>
      <input id="promo" name="promo" type="number" value="0" min="0" step="1" inputmode="numeric">
    </div>

    <div class="row">
      <label for="period">Откатались в период:</label>
      <input id="period" name="period" type="number" value="0" min="0" step="1" inputmode="numeric">
    </div>

    <div class="row">
      <label for="clients">Клиентов общее:</label>
      <input id="clients" name="clients" type="number" value="0" min="0" step="1" inputmode="numeric">
    </div>

    <div class="row">
      <label for="total">Итог:</label>
      <input id="total" name="total" type="number" value="0" readonly>
    </div>
  </fieldset>

  <fieldset class="section">
    <legend>Тележки</legend>

    <div class="row">
      <label for="cartCash">Нал:</label>
      <input id="cartCash" name="cartCash" type="number" value="0" min="0" step="0.01" inputmode="decimal">
    </div>

    <div class="row">
      <label for="cartCashless">Б/н:</label>
      <input id="cartCashless" name="cartCashless" type="number" value="0" min="0" step="0.01" inputmode="decimal">
    </div>

    <div class="row">
      <label for="cartPeriod">Откатались в период:</label>
      <input id="cartPeriod" name="cartPeriod" type="number" value="0" min="0" step="1" inputmode="numeric">
    </div>

    <div class="row">
      <label for="cartClients">Клиентов общее:</label>
      <input id="cartClients" name="cartClients" type="number" value="0" min="0" step="1" inputmode="numeric">
    </div>

    <div class="row">
      <label for="cartTotal">Итог:</label>
      <input id="cartTotal" name="cartTotal" type="number" value="0" readonly>
    </div>
  </fieldset>

  <fieldset class="section">
    <legend>Розыгрыш</legend>

    <div class="row">
      <label for="raffle">Розыгрыш:</label>
      <input id="raffle" name="raffle" type="number" value="4" min="0" step="1" inputmode="numeric">
    </div>
  </fieldset>

  <div class="actions">
    <button type="button" id="generateBtn">Сформировать отчёт</button>
    <button type="button" id="copyBtn" class="secondary">Скопировать</button>
  </div>

  <label class="sr-only" for="result">Результат отчёта</label>
  <textarea id="result" readonly placeholder="Здесь появится отчёт"></textarea>
  <div id="copyStatus" class="status" role="status" aria-live="polite"></div>
</form>

<script>
  const $ = (id) => document.getElementById(id);

  const fields = {
    time: $('time'),
    cash: $('cash'),
    cashless: $('cashless'),
    promo: $('promo'),
    period: $('period'),
    clients: $('clients'),
    total: $('total'),
    cartCash: $('cartCash'),
    cartCashless: $('cartCashless'),
    cartPeriod: $('cartPeriod'),
    cartClients: $('cartClients'),
    cartTotal: $('cartTotal'),
    raffle: $('raffle'),
    result: $('result'),
    copyStatus: $('copyStatus')
  };

  function toNumber(value) {
    const number = Number(String(value).replace(',', '.'));
    return Number.isFinite(number) ? number : 0;
  }

  function updateTotals() {
    fields.total.value = toNumber(fields.cash.value) + toNumber(fields.cashless.value);
    fields.cartTotal.value = toNumber(fields.cartCash.value) + toNumber(fields.cartCashless.value);
  }

  function generateReport() {
    updateTotals();

    const report = [
      'Основной отчёт',
      `На время: ${fields.time.value || '—'}`,
      `Нал: ${fields.cash.value || 0}`,
      `Б/н: ${fields.cashless.value || 0}`,
      `Прокатов акции: ${fields.promo.value || 0}`,
      `Откатались в период: ${fields.period.value || 0}`,
      `Клиентов общее: ${fields.clients.value || 0}`,
      `Итог: ${fields.total.value || 0}`,
      '',
      'Тележки',
      `Нал: ${fields.cartCash.value || 0}`,
      `Б/н: ${fields.cartCashless.value || 0}`,
      `Откатались в период: ${fields.cartPeriod.value || 0}`,
      `Клиентов общее: ${fields.cartClients.value || 0}`,
      `Итог: ${fields.cartTotal.value || 0}`,
      '',
      `Розыгрыш: ${fields.raffle.value || 0}`
    ].join('\n');

    fields.result.value = report;
  }

  let statusTimer;

  function showStatus(message) {
    fields.copyStatus.textContent = message;
    clearTimeout(statusTimer);

    statusTimer = setTimeout(() => {
      fields.copyStatus.textContent = '';
    }, 2000);
  }

  async function copyReport() {
    if (!fields.result.value.trim()) {
      generateReport();
    }

    try {
      await navigator.clipboard.writeText(fields.result.value);
      showStatus('Скопировано');
    } catch (error) {
      fields.result.select();
      document.execCommand('copy');
      showStatus('Скопировано');
    }
  }

  $('generateBtn').addEventListener('click', generateReport);
  $('copyBtn').addEventListener('click', copyReport);

  ['cash', 'cashless', 'cartCash', 'cartCashless'].forEach((id) => {
    $(id).addEventListener('input', updateTotals);
  });

  updateTotals();
</script>

</body>
</html>
